name: publish

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    publish:
        environment: production
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 25.x
                  token: ${{ secrets.GITHUB_TOKEN }}
                  oidc: true
            - run: npm i
            - run: npm run build
            - run: npm publish
